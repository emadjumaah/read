<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>لقطات دروس المهارات والقصص</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    .cell { background: rgba(255,255,255,.35); border-radius: 24px; padding: .5rem; }
    .cell > h4 { margin: .2rem 0 .4rem; text-align: center; color: #b8720a; }
    .app { max-width: none; padding: 0; }
    .dev { display: none; }   /* أدوات التجربة تُستعمل للقيادة فقط ولا تدخل اللقطة */
  </style>
</head>
<body>
<div id="toast" class="toast" hidden></div>
<div class="grid" id="grid"></div>

<!-- تقدّم مزروع قبل تحميل الوحدات: أتمّ كل شيء حتى القصة الثالثة -->
<script>
  localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 2, stars: {}, skills: {}, days: {}, reviews: {}, seconds: 0,
    startedAt: Date.now(), updatedAt: Date.now(),
  }));
</script>

<script type="module">
import { renderSkillLesson } from './js/skill.js';
import { renderStory } from './js/story.js';
import * as progress from './js/progress.js';

// صوت لا ينتهي أبداً: تُجمَّد الحالة المعروضة فلا تنتقل الخطوة تلقائياً قبل اللقطة
window.Audio = class { play() { return new Promise(() => {}); } pause() {} };

// تقدّم يفتح كل العقد (اللقطات تُبنى مباشرةً، والقفل يُفحص في اختبار المتصفّح)
for (const node of progress.allNodes()) progress.setStars(node.id, 3);

const grid = document.getElementById('grid');
const $$ = (root, sel) => [...root.querySelectorAll(sel)];

function cell(title, node) {
  const box = document.createElement('div');
  box.className = 'cell';
  box.innerHTML = `<h4>${title}</h4>`;
  const app = document.createElement('div');
  app.className = 'app';
  app.append(node);
  box.append(app);
  grid.append(box);
  return app;
}

const step = (app, label) => $$(app, '.btn').find((b) => b.textContent.includes(label))?.click();

// ١) درس المدّ: القاعدة والأمثلة
cell('١ — درس المهارة: القاعدة', renderSkillLesson('madd'));

// ٢) الشدّة: خطوة المقارنة (مفكوكة ← مشدَّدة)
const shadda = cell('٢ — قارِن بأذنك (الشدّة)', renderSkillLesson('shadda'));
step(shadda, 'تابع');

// ٣) التنوين: خطوة التمييز
const tanween = cell('٣ — ميّز بأذنك (التنوين)', renderSkillLesson('tanween'));
step(tanween, 'تابع');
step(tanween, 'تابع');

// ٤) اللام الشمسية والقمرية: المقارنة
const lam = cell('٤ — القمرية والشمسية', renderSkillLesson('lam'));
step(lam, 'تابع');

// ٥) صفحة قراءة: القصة الأولى
cell('٥ — شاشة القراءة (قصة ١)', renderStory('st1'));

// ٦) القصة الثالثة بعد قراءتها كاملةً (ختام + نجوم)
const st3 = cell('٦ — ختام القراءة (قصة ٣)', renderStory('st3'));
$$(st3, '.line-ear').forEach((b) => b.click());
$$(st3, '.next')[0].click();

// ٧) الخريطة: محطة المهارات والقصص بين المجموعتين ٣ و٤ (طفل أتمّ الثالثة)
progress.reset();
for (const node of progress.allNodes()) {
  if (node.id === 'skill:madd') break;
  progress.setStars(node.id, 3);
}
const map = cell('٧ — الخريطة: محطة ما بين المجموعتين', document.createElement('div'));
map.id = 'app';
await import('./js/main.js');   // يرسم الخريطة في #app (لا مسار في الرابط ⇒ الخريطة)
</script>
</body>
</html>
