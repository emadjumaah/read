<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>لقطات المراجعة ولوحة وليّ الأمر</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    .cell { background: rgba(255,255,255,.35); border-radius: 24px; padding: .5rem; }
    .cell > h4 { margin: .2rem 0 .4rem; text-align: center; color: #b8720a; }
    .app { max-width: none; padding: 0; }
    .dev { display: none; }   /* أدوات التجربة تُستعمل للقيادة فقط ولا تدخل اللقطة */
  </style>
</head>
<body>
<div id="toast" class="toast" hidden></div>
<div class="grid" id="grid"></div>

<!-- تقدّم مزروع قبل تحميل الوحدات: حصيلة حروف + سجلّ مهارات فيه متقن ومتعثّر -->
<script>
  const now = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const key = (d) => {
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const day = (back) => {
    const d = new Date();
    d.setDate(d.getDate() - back);
    return key(d);
  };
  const skill = (right, wrong, box, due) => ({ right, wrong, box, due: now + due, seen: now });
  localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 2,
    stars: {
      'g1:ا': 3, 'g1:ب': 3, 'g1:م': 2, 'g1:ل': 3, 'g1:words': 3,
      'g2:ن': 3, 'g2:ر': 2, 'g2:د': 3,
    },
    skills: {
      'ب|sukun|build': skill(1, 4, 0, 0),
      'م|fatha|haraka': skill(2, 3, 0, 0),
      'ل|damma|quiz': skill(0, 2, 0, 0),
      'ن|kasra|quiz': skill(1, 1, 0, 0),
      'ر|fatha|quiz': skill(4, 0, 4, 8),
      'د|fatha|quiz': skill(5, 0, 5, 16),
      'ا|fatha|quiz': skill(6, 0, 5, 16),
      'ب|fatha|haraka': skill(3, 1, 3, 4),
    },
    days: { [day(0)]: 8 * 60, [day(1)]: 12 * 60, [day(2)]: 0, [day(3)]: 15 * 60, [day(4)]: 6 * 60, [day(6)]: 9 * 60 },
    reviews: { [day(1)]: { tries: 9, right: 8, at: Date.now() } },
    seconds: 50 * 60,
    startedAt: Date.now(), updatedAt: Date.now(),
  }));
</script>

<script type="module">
import { renderReview } from './js/review.js';
import { renderParent } from './js/parent.js';
import * as progress from './js/progress.js';

// صوت لا ينتهي أبداً: تُجمَّد الحالة المعروضة فلا ينتقل التمرين تلقائياً قبل اللقطة
window.Audio = class { play() { return new Promise(() => {}); } pause() {} };

const grid = document.getElementById('grid');
const $$ = (root, sel) => [...root.querySelectorAll(sel)];

function cell(title, node) {
  const box = document.createElement('div');
  box.className = 'cell';
  box.innerHTML = `<h4>${title}</h4>`;
  const app = document.createElement('div');
  app.className = 'app';
  app.append(node);
  box.append(app);
  grid.append(box);
  return app;
}

// كل لقطة جلسة مستقلة تبدأ بأضعف مهارة مستحقّة، فنُثبّت مهارةً بين اللقطات
// كي يتغيّر رأس القائمة وتظهر التمارين الثلاثة كما يراها الطفل.
cell('١ — تركيب كلمة (المستحقّ الأضعف)', renderReview());

progress.recordAttempt('ب', 'sukun', progress.KINDS.BUILD, true);
cell('٢ — تمييز الحركة بالأذن', renderReview());

progress.recordAttempt('م', 'fatha', progress.KINDS.HARAKA, true);
cell('٣ — تمييز الحرف بالأذن', renderReview());

// ٤) ختام المراجعة
const fourth = cell('٤ — ختام المراجعة', renderReview());
$$(fourth, '.btn').find((b) => b.textContent.includes('إنهاء المراجعة')).click();

// ٥) بوابة وليّ الأمر ثم لوحته
cell('٥ — بوابة وليّ الأمر', renderParent(() => {}));
const gate = cell('٦ — لوحة وليّ الأمر', renderParent(() => {}));
const [a, b] = gate.querySelector('.giant').textContent.split('×')
  .map((s) => Number(s.trim().replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))));
gate.querySelector('input.chip').value = String(a * b);
$$(gate, '.btn').find((x) => x.textContent.includes('ادخل')).click();
gate.replaceChildren(renderParent(() => {}));
</script>
</body>
</html>
